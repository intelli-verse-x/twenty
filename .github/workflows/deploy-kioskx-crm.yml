name: Deploy KioskX CRM
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse the upstream Twenty rebuild
        run: |
          echo "A push to main used to dispatch twenty-build.yml."
          echo "That rebuild replaces the cream Inquiry Desk with the white hired desk."
          echo "The live desk is the kioskx-cream-desk image overlay. This workflow does not deploy it."
          exit 1
